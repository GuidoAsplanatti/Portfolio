<section id="projects" class="page-padding py-24 bg-secondary dark:bg-[#0c1220] relative border-y border-gray-200 dark:border-white/10 transition-colors duration-500">
  <div class="max-w-7xl mx-auto flex flex-col items-center">
    
    <div class="text-center mb-16 max-w-2xl mx-auto transition-colors duration-500">
      <h2 class="text-4xl md:text-5xl font-serif font-bold text-primary dark:text-white mb-6">Proyectos Web</h2>
      <p class="text-[1.1rem] text-gray-500 dark:text-gray-400">Desarrollos de software y aplicaciones interactivas que resuelven problemas del mundo real.</p>
    </div>

    <!-- Reminder: Place images in src/assets/images/projects/ (project-1.jpg, project-2.jpg, etc.) to match paths in projects.component.ts -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10 w-full animate-slide-up transition-colors duration-500">
      
      <!-- Project Card -->
      <article *ngFor="let project of projects" class="flex flex-col bg-white dark:bg-[#131b2b] rounded-2xl overflow-hidden clean-border dark:border-white/5 shadow-sm hover:shadow-xl hover:-translate-y-2 transition-all duration-300 group">
        
        <!-- Image Container -->
        <div class="aspect-[16/10] w-full relative overflow-hidden bg-gray-200 dark:bg-black">
          <img [src]="project.image" alt="Screenshot" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-in-out">
          <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        </div>

        <!-- Content -->
        <div class="p-8 flex flex-col flex-grow">
          <h3 class="text-2xl font-serif font-bold text-primary dark:text-white mb-3 group-hover:text-amber-500 dark:group-hover:text-amber-400 transition-colors">{{ project.title }}</h3>
          <p class="text-gray-500 dark:text-gray-400 text-[0.95rem] leading-relaxed mb-8 flex-grow">
            {{ project.description }}
          </p>
          
          <!-- Tech Stack -->
          <div class="mt-auto pt-5 border-t border-gray-100 dark:border-white/10">
            <span class="text-[0.65rem] font-bold text-gray-400 dark:text-gray-500 uppercase tracking-widest block mb-4">Tech Stack</span>
            <div class="flex flex-wrap gap-2 mb-6">
               <span *ngFor="let tech of project.stack" class="px-3 py-1 bg-gray-100 dark:bg-[#1a2233] text-gray-600 dark:text-gray-400 text-[0.7rem] font-semibold rounded-full clean-border dark:border-white/5">
                 {{ tech }}
               </span>
            </div>

            <!-- CTAs -->
            <div class="flex flex-col sm:flex-row gap-3">
              <a href="#" target="_blank" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-white text-sm font-bold rounded-xl transition-all duration-300 shadow-sm hover:shadow-md group/btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 group-hover/btn:scale-110 transition-transform">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
                </svg>
                Visitar Web
              </a>
              <a href="#" target="_blank" class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-gray-900 dark:bg-black hover:bg-gray-800 dark:hover:bg-gray-900 text-white text-sm font-bold rounded-xl transition-all duration-300 shadow-sm hover:shadow-md group/btn border border-white/5">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" class="w-4 h-4 group-hover/btn:scale-110 transition-transform">
                  <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
                </svg>
                GitHub
              </a>
            </div>
          </div>
        </div>

      </article>

    </div>
  </div>
</section>
