<!-- Invisible Backdrop to Close Player on Click Outside -->
<div *ngIf="isOpen" 
     (click)="closePlayer()" 
     class="fixed inset-0 z-40 bg-transparent cursor-default">
</div>

<!-- Spotify Card Wrapper -->
<div class="fixed bottom-24 right-6 z-50 transition-all duration-500 ease-in-out origin-bottom-right transform"
     [ngClass]="{
       'scale-100 opacity-100 translate-y-0': isOpen,
       'scale-0 opacity-0 translate-y-10': !isOpen
     }">
  
  <div class="bg-neutral-900 rounded-xl overflow-hidden shadow-2xl border border-white/10 p-1">
    <!-- Spotify Iframe Embed -->
    <iframe [src]="spotifyUrl" 
            width="300" 
            height="80" 
            frameborder="0" 
            allowtransparency="true" 
            allow="encrypted-media"
            class="rounded-lg">
    </iframe>
  </div>

  <!-- Subtle Tip/Arrow -->
  <div class="absolute -bottom-2 right-6 w-4 h-4 bg-neutral-900 rotate-45 border-r border-b border-white/10 z-[-1]"></div>
</div>

<!-- Floating Action Button (FAB) -->
<button (click)="togglePlayer()" 
        type="button"
        class="fixed bottom-6 right-6 z-50 bg-white dark:bg-neutral-800 text-neutral-900 dark:text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center hover:scale-110 active:scale-95 transition-all duration-300 group overflow-hidden border border-neutral-200 dark:border-white/10"
        title="Escuchar Música">
  
  <!-- Subtle Background Pulse Effect -->
  <span class="absolute inset-0 bg-primary/10 rounded-full scale-0 group-hover:scale-100 transition-transform duration-500"></span>

  <!-- Music Note SVG Icon -->
  <svg xmlns="http://www.w3.org/2000/svg" 
       viewBox="0 0 24 24" 
       fill="currentColor" 
       class="w-6 h-6 relative z-10 text-primary dark:text-white transition-transform group-hover:rotate-12">
    <path fill-rule="evenodd" d="M19.952 1.651a.75.75 0 01.298.599V16.303a3 3 0 01-2.176 2.884l-1.32.377a2.25 2.25 0 01-2.815-2.13V15.55a2.25 2.25 0 012.25-2.25h1.311V4.178L8.75 5.97v12.033a3 3 0 01-2.176 2.884l-1.32.377a2.25 2.25 0 01-2.815-2.13V17.25a2.25 2.25 0 012.25-2.25h1.311V4.003a.75.75 0 01.838-.742l11.25 1.5a.75.75 0 01.18.89l-11.25-1.5z" clip-rule="evenodd" />
  </svg>
</button>
